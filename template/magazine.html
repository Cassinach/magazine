<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{CSP}}
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<style>
:root{
  --bg:#ece7dc; --paper:#fdfbf6; --paper2:#f6f1e6; --ink:#1e1c18; --ink2:#4a463f; --muted:#7a7468;
  --rule:#d8d1c2; --accent:#b4451f; --accent-ink:#fff; --code-bg:#f0ebe0; --shadow:0 18px 40px -22px rgba(40,30,10,.45);
  --font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic Medium","YuGothic","Segoe UI",system-ui,sans-serif;
  --font-head:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Source Han Serif JP",Georgia,serif;
  --font-mono:"SF Mono","JetBrains Mono",Menlo,Consolas,"Noto Sans Mono",monospace;
  --hud-h:44px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121110; --paper:#1d1b18; --paper2:#242119; --ink:#ebe6da; --ink2:#c9c2b4; --muted:#938c7e;
    --rule:#3a362e; --code-bg:#15130f; --shadow:0 18px 40px -22px rgba(0,0,0,.8); }
}
/* セクションごとの差し色 */
[data-sec="cover"]{--accent:#1e1c18}
[data-sec="toc"],[data-sec="colophon"]{--accent:#5c574d}
[data-sec="dashboard"]{--accent:#8a3b12}
[data-sec="feature"]{--accent:#b4451f}
[data-sec="frontend"]{--accent:#1f6f9f}
[data-sec="backend"]{--accent:#2f7d4f}
[data-sec="infra"]{--accent:#6b5b95}
[data-sec="recon3d"]{--accent:#c2731b}
[data-sec="ai"]{--accent:#a52a5c}
[data-sec="devtools"]{--accent:#3b7a8c}
[data-sec="security"]{--accent:#9b1c1c}
[data-sec="releases"]{--accent:#556b2f}
[data-sec="try"]{--accent:#c48a00}
[data-sec="glossary"]{--accent:#4f6d7a}
@media (prefers-color-scheme: dark){
  [data-sec="cover"]{--accent:#ebe6da}
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.85;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;font-feature-settings:"palt" 1}
a{color:var(--accent)}
code,pre{font-family:var(--font-mono);font-size:.88em}
code{background:var(--code-bg);padding:.1em .4em;border-radius:4px}
pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow:auto;line-height:1.55;position:relative}
pre code{background:none;padding:0}
pre[data-lang]::before{content:attr(data-lang);position:absolute;top:6px;right:10px;font-size:10px;color:var(--muted);letter-spacing:.05em}

/* ===== 本 ===== */
#book{position:fixed;inset:0 0 var(--hud-h) 0;display:flex;direction:rtl;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
#book::-webkit-scrollbar{display:none}
.spread{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;direction:rtl;
  padding:22px 28px 14px;gap:0}
.page{direction:ltr;flex:1 1 0;min-width:0;height:100%;background:var(--paper);box-shadow:var(--shadow);position:relative;
  display:flex;flex-direction:column;overflow:hidden}
.spread.two .page:first-child{border-radius:0 6px 6px 0}
.spread.two .page:last-child{border-radius:6px 0 0 6px}
.spread.two .page:first-child::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;
  background:linear-gradient(to right,rgba(0,0,0,.10),transparent);pointer-events:none;z-index:1}
.spread.two .page:last-child::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;
  background:linear-gradient(to left,rgba(0,0,0,.10),transparent);pointer-events:none;z-index:1}
.spread.one .page{border-radius:6px}
.page.blank{background:var(--paper2)}
.page.blank .mark{position:absolute;inset:0;display:grid;place-items:center;color:var(--rule);font-family:var(--font-head);font-size:13px;letter-spacing:.3em}

/* ページ内レイアウト */
.page .body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:34px 44px 30px;scrollbar-width:thin}
.spread.two .page:first-child .body{padding-left:56px}
.spread.two .page:last-child .body{padding-right:56px}
.page .folio{position:absolute;bottom:12px;font-size:11px;color:var(--muted);letter-spacing:.08em;font-family:var(--font-head)}
.spread.two .page:first-child .folio,.spread.one .folio{right:22px}
.spread.two .page:last-child .folio{left:22px}
.page .thumb{position:absolute;top:0;width:7px;height:100%;background:var(--accent);opacity:.9}
.spread.two .page:first-child .thumb,.spread.one .thumb{right:0}
.spread.two .page:last-child .thumb{left:0}
.page .thumb span{position:absolute;top:var(--thumb-y,120px);left:50%;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;
  font-size:9px;letter-spacing:.3em;color:var(--accent-ink);white-space:nowrap;opacity:0}
.page .kicker{font-size:11px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;font-weight:700;margin:0 0 10px}
.page h1,.page h2{font-family:var(--font-head);font-weight:600;line-height:1.35;letter-spacing:.01em;margin:0 0 14px}
.page h2{font-size:27px}
.page h3{font-size:16px;margin:26px 0 8px;font-weight:700;letter-spacing:.02em;border-left:3px solid var(--accent);padding-left:10px;line-height:1.5}
.page h4{font-size:14.5px;margin:20px 0 6px}
.page p{margin:0 0 1em;text-align:justify}
.page ul,.page ol{padding-left:1.5em;margin:0 0 1em}
.page li{margin:.2em 0}
.page blockquote{margin:1em 0;padding:.4em 1em;border-left:3px solid var(--rule);color:var(--ink2)}
.tbl{overflow-x:auto;margin:0 0 1.2em}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.6}
th,td{border-bottom:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--ink2);border-bottom:2px solid var(--ink2);font-size:12.5px;letter-spacing:.04em}
.lead{font-size:16px;line-height:1.9;color:var(--ink2);margin:0 0 1.4em;font-weight:500}
.article-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 18px;font-size:11.5px;color:var(--muted)}
.tag{border:1px solid var(--rule);border-radius:999px;padding:0 9px;line-height:1.8}
.impact{font-weight:700;letter-spacing:.1em}
.impact-high{color:#b4451f}.impact-mid{color:#9a7b00}.impact-low{color:var(--muted)}
.sources{margin-top:26px;padding-top:12px;border-top:1px dashed var(--rule);font-size:12px;color:var(--muted);line-height:1.7}
.sources ol{padding-left:1.6em;margin:0}
.sources a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--rule)}
.sources .d{margin-left:.5em;font-variant-numeric:tabular-nums}
sup.cite{font-size:.7em;line-height:0;vertical-align:super}
sup.cite a{text-decoration:none;color:var(--accent);font-weight:700}
.next-step{margin-top:18px;padding:12px 14px;background:var(--paper2);border-radius:8px;font-size:13.5px}
.next-step b{color:var(--accent)}
.summary{margin:0 0 18px;padding:12px 16px;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:6px;background:var(--paper2)}
.summary-t{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:700;margin-bottom:4px}
.summary ul{margin:0;padding-left:1.2em;font-size:14.5px;line-height:1.75}
.summary li{margin:.15em 0}
figure.fig{margin:16px 0 20px}
figure.fig img{display:block;max-width:100%;max-height:52vh;margin:0 auto;border-radius:6px;background:#fff}
figure.fig figcaption{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;text-align:center}
figure.fig .figsrc{text-decoration:none;color:var(--accent);font-weight:700}

/* 表紙 */
.page.cover .body{padding:0;display:flex;flex-direction:column;background:
  linear-gradient(160deg,var(--paper) 0%,var(--paper) 55%,var(--paper2) 100%)}
.cover .masthead{padding:42px 200px 0 48px}
.cover .masthead .brand{font-family:var(--font-head);font-size:clamp(36px,4.6vw,64px);font-weight:700;letter-spacing:-.02em;line-height:1;margin:0}
.cover .masthead .sub{font-size:12px;letter-spacing:.3em;color:var(--muted);margin:10px 0 0;text-transform:uppercase}
.cover .issue-no{position:absolute;top:44px;right:48px;text-align:right;font-family:var(--font-head);line-height:1.2}
.cover .issue-no b{display:block;font-size:30px}
.cover .issue-no small{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.cover .headlines{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 48px 56px;gap:18px}
.cover .headlines .h{font-family:var(--font-head);font-size:clamp(20px,2.4vw,30px);line-height:1.4;font-weight:600;border-left:4px solid var(--ink);padding-left:16px}
.cover .headlines .h small{display:block;font-family:var(--font-body);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:4px}
.cover .foot{padding:0 48px 26px;font-size:11px;color:var(--muted);letter-spacing:.12em;display:flex;justify-content:space-between}

/* 目次 */
.toc-list{list-style:none;padding:0;margin:0;columns:1}
.toc-list>li{break-inside:avoid;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.toc-list .sec{display:flex;align-items:baseline;gap:10px;font-family:var(--font-head);font-size:17px;font-weight:600;cursor:pointer}
.toc-list .sec .no{font-size:12px;color:var(--accent);letter-spacing:.1em;min-width:2.2em;font-family:var(--font-body)}
.toc-list .sec .pg{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--font-body)}
.toc-list .arts{list-style:none;padding:0 0 0 2.8em;margin:4px 0 0;font-size:13px;color:var(--ink2)}
.toc-list .arts li{display:flex;gap:8px;cursor:pointer;margin:2px 0}
.toc-list .arts li:hover{color:var(--accent)}
.toc-list .arts .pg{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

/* セクション扉 */
.page.opener .body{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:48px;
  background:linear-gradient(to bottom,transparent 50%,color-mix(in srgb,var(--accent) 7%,transparent))}
.opener .big{font-family:var(--font-head);font-size:clamp(70px,9vw,120px);line-height:.9;color:var(--accent);opacity:.18;font-weight:700;position:absolute;top:30px;right:40px}
.opener h2{font-size:38px}
.opener .lead{font-size:15px}
.opener .list{list-style:none;padding:0;margin:18px 0 0;font-size:13.5px;color:var(--ink2)}
.opener .list li{display:flex;gap:10px;margin:4px 0;cursor:pointer}
.opener .list li:hover{color:var(--accent)}
.opener .list .pg{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

/* 定点観測ボード */
.dash{width:100%;border-collapse:collapse;font-size:13px}
.dash th{font-size:11px}
.dash td{padding:8px 8px}
.dash .layer{font-size:10.5px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.dash .pick{font-weight:700;font-size:14px}
.dash .ver{color:var(--muted);font-size:12px;margin-left:.4em;font-family:var(--font-mono)}
.dash .alt{color:var(--muted);font-size:12px}
.dash .why{color:var(--ink2);font-size:12.5px;line-height:1.55}
.dash .trend{white-space:nowrap;font-weight:700;font-size:12px}
.trend-new{color:#8a3b12}.trend-changed{color:#a52a5c}.trend-version{color:#2f7d4f}.trend-flat{color:var(--muted);font-weight:400}
.dash .from{display:block;font-size:11px;color:var(--muted);font-weight:400;text-decoration:line-through}
.dash .src a{color:var(--muted);text-decoration:none;font-size:11px;margin-right:4px}
.legend{font-size:11.5px;color:var(--muted);margin:0 0 10px;display:flex;gap:14px;flex-wrap:wrap}

/* リリースカレンダー */
.rel td:first-child{font-weight:700;white-space:nowrap}
.rel .v{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap}
.rel .d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* 今月試す */
.try .time{display:inline-block;font-size:11.5px;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 10px;margin-bottom:12px}
.try ol.steps{counter-reset:s;list-style:none;padding:0}
.try ol.steps li{counter-increment:s;position:relative;padding-left:2.4em;margin:.5em 0}
.try ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:.1em;font-family:var(--font-head);font-size:15px;color:var(--accent);font-weight:700}

/* 用語集 */
.gloss{columns:1;column-gap:36px}
.gloss dl{margin:0}
.gloss dt{font-weight:700;margin-top:10px;break-after:avoid}
.gloss dd{margin:0 0 6px;color:var(--ink2);font-size:13.5px}

/* 奥付 */
.colophon .meta{font-size:13px;color:var(--ink2);line-height:1.9}
.colophon ol{font-size:12px;color:var(--muted);line-height:1.65;padding-left:2.4em}
.colophon ol li{margin:2px 0;overflow-wrap:anywhere}
.colophon a{color:var(--ink2);text-decoration:none}
.colophon a:hover{color:var(--accent)}
.incomplete{background:#9b1c1c;color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:14px}

/* ===== HUD ===== */
#hud{position:fixed;left:0;right:0;bottom:0;height:var(--hud-h);display:flex;align-items:center;gap:10px;padding:0 14px;
  font-size:12px;color:var(--muted);user-select:none;letter-spacing:.04em}
#hud .btn{background:none;border:1px solid var(--rule);color:var(--ink2);border-radius:6px;height:28px;min-width:28px;padding:0 10px;
  font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#hud .btn:hover{border-color:var(--accent);color:var(--accent)}
#hud .pos{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:8em}
#hud .sec{font-weight:700;color:var(--accent)}
#hud .sp{flex:1}
#hud .bar{position:absolute;left:0;right:0;top:0;height:2px;background:var(--rule)}
#hud .bar i{position:absolute;right:0;top:0;height:100%;background:var(--accent);width:0;transition:width .2s}
#hud kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--rule);border-radius:3px;padding:0 4px}
.zone{position:fixed;top:0;bottom:var(--hud-h);width:60px;cursor:pointer;z-index:5;opacity:0;transition:opacity .2s}
.zone:hover{opacity:1}
.zone::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-top:2px solid var(--muted);border-left:2px solid var(--muted);transform:translateY(-50%) rotate(-45deg)}
.zone.next{left:0}.zone.next::after{left:18px}
.zone.prev{right:0}.zone.prev::after{right:18px;transform:translateY(-50%) rotate(135deg)}

/* 目次オーバーレイ */
#toc{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);z-index:20;display:none;overflow:auto;padding:40px 24px}
#toc.open{display:block}
#toc .inner{max-width:880px;margin:0 auto;background:var(--paper);padding:32px 40px;border-radius:10px;box-shadow:var(--shadow)}
#toc .inner h2{font-family:var(--font-head);margin:0 0 18px;font-size:22px}
#toc .toc-list{columns:2;column-gap:40px}
#toc .close{float:right;background:none;border:1px solid var(--rule);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink2);font:inherit}
#help{position:fixed;inset:auto 14px var(--hud-h) auto;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 16px;font-size:12px;line-height:1.9;display:none;z-index:21;box-shadow:var(--shadow)}
#help.open{display:block}

/* ===== 狭い画面 ===== */
@media (max-width:760px){
  body{font-size:14.5px}
  .spread{padding:10px 10px 8px}
  .page .body{padding:26px 22px 28px}
  .spread.one .page .body{padding-right:22px}
  .page h2{font-size:23px}
  .opener h2{font-size:30px}
  .cover .masthead{padding:30px 26px 0}
  .cover .issue-no{position:static;text-align:left;margin:14px 26px 0}
  .cover .masthead .brand{font-size:46px}
  .cover .issue-no{top:30px;right:26px}
  .cover .headlines{padding:0 26px 40px}
  .cover .foot{padding:0 26px 20px}
  #toc .toc-list{columns:1}
  #hud .hint{display:none}
  .zone{width:36px}
}

/* ===== 印刷（PDF 化） ===== */
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  html,body{background:#fff;color:#000;font-size:11pt}
  #book{position:static;display:block;overflow:visible;direction:ltr;inset:auto}
  .spread{display:contents}
  .page{height:auto;overflow:visible;box-shadow:none;break-before:page;border-radius:0;display:block}
  .page.blank,#hud,.zone,#toc,#help,.page .thumb{display:none!important}
  .page .body{overflow:visible;padding:0}
  .page .folio{position:static;display:block;text-align:right;margin-top:10mm}
  .page.cover .body{min-height:240mm;display:flex}
  .cover .masthead,.cover .headlines,.cover .foot{padding-left:0;padding-right:0}
  .cover .issue-no{right:0;top:0}
  .opener .big{position:static;opacity:.25;font-size:60pt}
  .page.opener .body{background:none;min-height:0}
  a{color:#000}
  .sources a::after{content:""}
  pre{white-space:pre-wrap;word-break:break-all}
  figure.fig img{max-height:120mm}
}
</style>
</head>
<body>
<div id="book">
{{PAGES}}
</div>

<div class="zone next" title="次のページ (←)"></div>
<div class="zone prev" title="前のページ (→)"></div>

<div id="hud">
  <div class="bar"><i id="progress"></i></div>
  <button class="btn" id="b-next" title="次のページ (←)">←</button>
  <button class="btn" id="b-prev" title="前のページ (→)">→</button>
  <span class="pos" id="pos"></span>
  <span class="sec" id="cursec"></span>
  <span class="sp"></span>
  <span class="hint">右から左へめくります　<kbd>←</kbd> 次 <kbd>→</kbd> 前 <kbd>t</kbd> 目次 <kbd>p</kbd> 印刷</span>
  <button class="btn" id="b-toc" title="目次 (t)">目次</button>
  <button class="btn" id="b-help" title="操作 (?)">?</button>
</div>

<div id="toc"><div class="inner">
  <button class="close" id="b-toc-close">閉じる</button>
  <h2>目次</h2>
  {{TOC}}
</div></div>

<div id="help">
  <b>操作</b><br>
  ← / Space / PageDown：次のページ（左へ）<br>
  → / Shift+Space / PageUp：前のページ<br>
  Home / End：表紙 / 奥付<br>
  t：目次　p：印刷（PDF 保存）　?：このヘルプ<br>
  画面の左右端クリック、トラックパッドの横スワイプでもめくれます
</div>

<script>
(() => {
  const book = document.getElementById('book');
  const pages = Array.from(book.querySelectorAll('.page'));
  pages.forEach(p => p.remove());
  let spreads = [];
  let cur = 0; // 現在の見開き index
  let two = false;
  const $ = id => document.getElementById(id);

  const blank = () => { const d = document.createElement('div'); d.className = 'page blank'; d.innerHTML = '<div class="mark">magazine</div>'; return d; };

  function isTwo() { return window.innerWidth >= 980 && window.innerWidth > window.innerHeight * 1.15; }

  function layout() {
    const firstPage = spreads[cur] ? spreads[cur].querySelector('.page:not(.blank)') : pages[0];
    const keep = pages.indexOf(firstPage);
    two = isTwo();
    book.textContent = '';
    spreads = [];
    const mk = () => { const s = document.createElement('div'); s.className = 'spread ' + (two ? 'two' : 'one'); book.appendChild(s); spreads.push(s); return s; };
    if (two) {
      let s = mk(); s.appendChild(pages[0]); s.appendChild(blank());
      let i = 1;
      while (i < pages.length) {
        s = mk(); s.appendChild(pages[i++]);
        if (i < pages.length) s.appendChild(pages[i++]); else s.appendChild(blank());
      }
    } else {
      for (const p of pages) mk().appendChild(p);
    }
    goToPage(Math.max(0, keep), 'instant');
  }

  function spreadOfPage(pi) {
    const p = pages[pi];
    return spreads.findIndex(s => s.contains(p));
  }
  let pendingUntil = 0; // プログラム的なスクロール中は scroll イベントで位置を上書きしない
  function goTo(si, behavior = 'smooth') {
    si = Math.max(0, Math.min(spreads.length - 1, si));
    cur = si;
    pendingUntil = Date.now() + (behavior === 'smooth' ? 900 : 150);
    spreads[si].scrollIntoView({ behavior, inline: 'start', block: 'nearest' });
    update();
  }
  book.addEventListener('scrollend', () => { pendingUntil = 0; });
  function goToPage(pi, behavior) { goTo(spreadOfPage(pi), behavior); }
  const next = () => goTo(cur + 1);
  const prev = () => goTo(cur - 1);

  function update() {
    const s = spreads[cur];
    const ps = Array.from(s.querySelectorAll('.page:not(.blank)'));
    const nums = ps.map(p => pages.indexOf(p) + 1);
    $('pos').textContent = (nums.length > 1 ? `p.${nums[0]}–${nums[nums.length - 1]}` : `p.${nums[0]}`) + ` / ${pages.length}`;
    $('cursec').textContent = ps[ps.length - 1].dataset.secTitle || '';
    $('progress').style.width = ((cur + 1) / spreads.length * 100) + '%';
    const first = ps[0];
    const anchor = first.dataset.anchor || first.id;
    if (anchor && location.hash !== '#' + anchor) history.replaceState(null, '', '#' + anchor);
    document.title = first.dataset.secTitle ? `${first.dataset.secTitle} — ${BASE_TITLE}` : BASE_TITLE;
  }
  const BASE_TITLE = document.title;

  // 現在位置の追従（スワイプ・トラックパッド）
  let raf = 0;
  book.addEventListener('scroll', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (Date.now() < pendingUntil) return;
      const bl = book.getBoundingClientRect().left;
      let best = 0, bd = Infinity;
      spreads.forEach((s, i) => { const d = Math.abs(s.getBoundingClientRect().left - bl); if (d < bd) { bd = d; best = i; } });
      if (best !== cur) { cur = best; update(); }
    });
  }, { passive: true });

  // ハッシュ → ページ
  const initialHash = location.hash;
  function pageFromHash(hash = location.hash) {
    const h = decodeURIComponent(hash.slice(1));
    if (!h) return -1;
    let p = pages.findIndex(x => x.id === h || x.dataset.anchor === h);
    if (p < 0) { const el = document.getElementById(h); if (el) p = pages.findIndex(x => x.contains(el)); }
    return p;
  }

  // 操作
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tocOpen = $('toc').classList.contains('open');
    if (e.key === 'Escape') { $('toc').classList.remove('open'); $('help').classList.remove('open'); return; }
    if (e.key === 't' || e.key === 'T') { $('toc').classList.toggle('open'); e.preventDefault(); return; }
    if (e.key === '?') { $('help').classList.toggle('open'); return; }
    if (e.key === 'p' || e.key === 'P') { window.print(); return; }
    if (tocOpen) return;
    if (e.key === 'ArrowLeft' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) { next(); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) { prev(); e.preventDefault(); }
    else if (e.key === 'Home') { goTo(0); e.preventDefault(); }
    else if (e.key === 'End') { goTo(spreads.length - 1); e.preventDefault(); }
  });
  document.querySelector('.zone.next').addEventListener('click', next);
  document.querySelector('.zone.prev').addEventListener('click', prev);
  $('b-next').addEventListener('click', next);
  $('b-prev').addEventListener('click', prev);
  $('b-toc').addEventListener('click', () => $('toc').classList.toggle('open'));
  $('b-toc-close').addEventListener('click', () => $('toc').classList.remove('open'));
  $('b-help').addEventListener('click', () => $('help').classList.toggle('open'));
  $('toc').addEventListener('click', e => { if (e.target === $('toc')) $('toc').classList.remove('open'); });

  // 目次・扉のリンク（data-goto="ページid"）
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-goto]');
    if (!t) return;
    const pi = pages.findIndex(p => p.id === t.dataset.goto);
    if (pi >= 0) { $('toc').classList.remove('open'); goToPage(pi); }
  });

  // 外部リンクは新しいタブで
  document.querySelectorAll('.page a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });

  window.addEventListener('resize', () => { if (isTwo() !== two) layout(); else goTo(cur, 'instant'); });
  window.addEventListener('hashchange', () => { const p = pageFromHash(); if (p >= 0) goToPage(p); });

  layout();
  const start = pageFromHash(initialHash);
  if (start > 0) goToPage(start, 'instant');
  // scroll-behavior: smooth を初期配置の後に効かせる
  book.style.scrollBehavior = 'auto';
  requestAnimationFrame(() => { goTo(cur, 'instant'); book.style.scrollBehavior = ''; });
  // フォント読込やサイズ確定の後にもう一度スナップ位置を合わせる
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => goTo(cur, 'instant'));
  window.addEventListener('load', () => goTo(cur, 'instant'));
})();
</script>
</body>
</html>
