<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{CSP}}
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<style>
:root{
  --bg:#ece7dc; --paper:#fdfbf6; --paper2:#f6f1e6; --ink:#1e1c18; --ink2:#4a463f; --muted:#7a7468;
  --rule:#d8d1c2; --accent:#b4451f; --accent-ink:#fff; --code-bg:#f0ebe0; --shadow:0 18px 40px -22px rgba(40,30,10,.45);
  --font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic Medium","YuGothic","Segoe UI",system-ui,sans-serif;
  --font-head:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Source Han Serif JP",Georgia,serif;
  --font-mono:"SF Mono","JetBrains Mono",Menlo,Consolas,"Noto Sans Mono",monospace;
  --hud-h:48px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121110; --paper:#1d1b18; --paper2:#242119; --ink:#ebe6da; --ink2:#c9c2b4; --muted:#938c7e;
    --rule:#3a362e; --code-bg:#15130f; --shadow:0 18px 40px -22px rgba(0,0,0,.8); }
}
/* セクションごとの差し色 */
[data-sec="cover"]{--accent:#1e1c18}
[data-sec="toc"],[data-sec="colophon"]{--accent:#5c574d}
[data-sec="dashboard"]{--accent:#8a3b12}
[data-sec="feature"]{--accent:#b4451f}
[data-sec="frontend"]{--accent:#1f6f9f}
[data-sec="backend"]{--accent:#2f7d4f}
[data-sec="infra"]{--accent:#6b5b95}
[data-sec="recon3d"]{--accent:#c2731b}
[data-sec="ai"]{--accent:#a52a5c}
[data-sec="devtools"]{--accent:#3b7a8c}
[data-sec="security"]{--accent:#9b1c1c}
[data-sec="releases"]{--accent:#556b2f}
[data-sec="try"]{--accent:#c48a00}
[data-sec="glossary"]{--accent:#4f6d7a}
@media (prefers-color-scheme: dark){ [data-sec="cover"]{--accent:#ebe6da} }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;font-feature-settings:"palt" 1;overflow:hidden}
a{color:var(--accent)}
code,pre{font-family:var(--font-mono);font-size:.88em}
code{background:var(--code-bg);padding:.1em .4em;border-radius:4px;white-space:nowrap;word-break:normal;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:baseline;line-height:1.5}
pre{background:var(--code-bg);padding:10px 12px;border-radius:8px;overflow:auto;line-height:1.5;position:relative;margin:0 0 1em}
pre code{background:none;padding:0;display:inline;white-space:pre;max-width:none;overflow:visible;line-height:inherit}
pre[data-lang]::before{content:attr(data-lang);position:absolute;top:6px;right:10px;font-size:10px;color:var(--muted);letter-spacing:.05em}

/* 日本語の改行を自然に（対応ブラウザでは文節で折り返す） */
h1,h2,h3,h4,figcaption,.lead,.summary li,.cover .h,.toc-list .sec,.opener .list li,.headline,th{word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
h1,h2,.cover .h,.opener h2{text-wrap:balance}
p,li,figcaption,.lead,td{text-wrap:pretty}

/* ===== 読み込み画面: セクションの色線が左から灯り、終わると左から上へ消えていく ===== */
#loader{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .45s ease}
#loader.out{opacity:0;pointer-events:none}
#loader .bars{display:flex;gap:14px;height:38vh;align-items:flex-end}
#loader .bars i{display:block;width:7px;height:100%;border-radius:3px;background:var(--accent);opacity:0;transform-origin:50% 100%;
  animation:bar-in .5s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * 70ms)}
#loader .caption{display:flex;flex-direction:column;align-items:center;gap:10px}
#loader .word,#loader .issue{font-family:var(--font-head);opacity:0;animation:bar-in .6s ease forwards}
/* 色線が全部灯ってから誌名、続けて号数。字間ぶんの右余白は padding-left で打ち消して中央に置く */
#loader .word{font-size:12px;letter-spacing:.42em;padding-left:.42em;color:var(--muted);animation-delay:calc(var(--n) * 70ms + 450ms)}
#loader .issue{font-size:22px;letter-spacing:.16em;padding-left:.16em;color:var(--ink);animation-delay:calc(var(--n) * 70ms + 630ms)}
@keyframes bar-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 退場: animation を差し替えると delay の間は素の opacity:0 に戻って一瞬消えるので、both で from を先に当てておく */
#loader.done .bars i{animation:bar-out .42s cubic-bezier(.6,0,.8,.2) both;animation-delay:calc(var(--i) * 60ms)}
#loader.done .word,#loader.done .issue{animation:word-out .3s ease both;animation-delay:calc(var(--n) * 60ms)}
@keyframes bar-out{from{opacity:1;transform:scaleY(1)}to{opacity:1;transform:scaleY(0)}}
@keyframes word-out{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion: reduce){#loader .bars i,#loader .word,#loader .issue{animation-duration:.01s;animation-delay:0s}#loader{transition:none}}
#track{visibility:hidden}
#track.ready{visibility:visible}

/* ===== 本（JS 駆動のスライダー） ===== */
#book{position:fixed;inset:0 0 var(--hud-h) 0;overflow:hidden;touch-action:pan-y pinch-zoom;user-select:text;cursor:default}
#track{display:flex;height:100%;will-change:transform;transition:transform .42s cubic-bezier(.22,.7,.25,1)}
#track.drag{transition:none}
.spread{flex:0 0 100%;width:100%;min-width:0;max-width:100%;height:100%;display:flex;padding:22px 28px 14px;gap:0;overflow:hidden}
.spread.one{padding:10px 10px 8px}
.page{flex:1 1 0;min-width:0;height:100%;background:var(--paper);box-shadow:var(--shadow);position:relative;
  display:flex;flex-direction:column;overflow:hidden;font-size:var(--fs,15px)}
.spread.two .page:first-child{border-radius:6px 0 0 6px}
.spread.two .page:last-child{border-radius:0 6px 6px 0}
.spread.two .page:first-child::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;
  background:linear-gradient(to left,rgba(0,0,0,.10),transparent);pointer-events:none;z-index:1}
.spread.two .page:last-child::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;
  background:linear-gradient(to right,rgba(0,0,0,.10),transparent);pointer-events:none;z-index:1}
.spread.one .page{border-radius:6px}
.page.blank{background:var(--paper2)}
.page.blank .mark{position:absolute;inset:0;display:grid;place-items:center;color:var(--rule);font-family:var(--font-head);font-size:13px;letter-spacing:.3em}

/* ページ内レイアウト */
.page .body{flex:1;min-height:0;min-width:0;overflow:hidden;padding:30px 40px 28px;scrollbar-width:thin}
.page.scrollable .body,.page.overflow .body{overflow-y:auto;overscroll-behavior:contain}
.page .more{display:none;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);letter-spacing:.1em;background:var(--paper);padding:0 8px;border-radius:999px;border:1px solid var(--rule);pointer-events:none;z-index:2;white-space:nowrap}
.page.overflow .more{display:block}
.spread.two .page:first-child .body{padding-right:52px}
.spread.two .page:last-child .body{padding-left:52px}
.page .folio{position:absolute;bottom:12px;font-size:11px;color:var(--muted);letter-spacing:.08em;font-family:var(--font-head)}
.spread.two .page:first-child .folio{left:22px}
.spread.two .page:last-child .folio,.spread.one .folio{right:22px}
.page .thumb{position:absolute;top:0;width:7px;height:100%;background:var(--accent);opacity:.9}
.spread.two .page:first-child .thumb{left:0}
.spread.two .page:last-child .thumb,.spread.one .thumb{right:0}
.page .kicker{font-size:11px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;font-weight:700;margin:0 0 10px}
.page h1,.page h2{font-family:var(--font-head);font-weight:600;line-height:1.35;letter-spacing:.01em;margin:0 0 12px}
.page h2{font-size:1.75em}
.page h3{font-size:1.06em;margin:1.3em 0 .5em;font-weight:700;letter-spacing:.02em;border-left:3px solid var(--accent);padding-left:10px;line-height:1.5}
.page h3:first-child{margin-top:0}
.page h4{font-size:1em;margin:1.1em 0 .4em}
.page p{margin:0 0 .9em;text-align:justify}
.page ul,.page ol{padding-left:1.5em;margin:0 0 .9em}
.page li{margin:.15em 0}
.page blockquote{margin:.9em 0;padding:.3em 1em;border-left:3px solid var(--rule);color:var(--ink2)}
.tbl{overflow-x:auto;margin:0 0 1em}
table{border-collapse:collapse;width:100%;font-size:.9em;line-height:1.55}
th,td{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--ink2);border-bottom:2px solid var(--ink2);font-size:.85em;letter-spacing:.04em}
.lead{font-size:1.06em;line-height:1.85;color:var(--ink2);margin:0 0 1.1em;font-weight:500}
.article-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 14px;font-size:.78em;color:var(--muted)}
.tag{border:1px solid var(--rule);border-radius:999px;padding:0 9px;line-height:1.8}
.impact{font-weight:700;letter-spacing:.1em}
.impact-high{color:#b4451f}.impact-mid{color:#9a7b00}.impact-low{color:var(--muted)}
.sources{margin-top:1.4em;padding-top:10px;border-top:1px dashed var(--rule);font-size:.78em;color:var(--muted);line-height:1.6}
.sources ol{padding-left:1.6em;margin:0}
.sources a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--rule)}
.sources .d{margin-left:.5em;font-variant-numeric:tabular-nums}
sup.cite{font-size:.7em;line-height:0;vertical-align:super}
sup.cite a{text-decoration:none;color:var(--accent);font-weight:700}
.next-step{margin-top:1em;padding:10px 14px;background:var(--paper2);border-radius:8px;font-size:.9em}
.next-step b{color:var(--accent)}
.summary{margin:0 0 16px;padding:12px 16px;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:6px;background:var(--paper2)}
.summary-t{font-size:.72em;letter-spacing:.2em;color:var(--accent);font-weight:700;margin-bottom:4px}
.summary ul{margin:0;padding-left:1.2em;font-size:.98em;line-height:1.7}
.summary li{margin:.15em 0}
figure.fig{margin:14px 0 16px}
figure.fig img{display:block;max-width:100%;max-height:calc(var(--figh,38) * 1vh);margin:0 auto;border-radius:6px;background:#fff}
figure.fig figcaption{font-size:.78em;color:var(--muted);margin-top:6px;line-height:1.6;text-align:left}
figure.fig .figsrc{text-decoration:none;color:var(--accent);font-weight:700}
.art-head .fig-stack{display:flex;flex-direction:column;gap:6px}
.art-head .flow{margin-top:.6em}
.art-head .flow>:first-child{margin-top:0}
.art-body .body{padding-top:30px}
.art-body .body>:first-child{margin-top:0}
.art-head figure.fig{margin:10px 0 0}

/* 表紙 */
.page.cover .body{padding:0;display:flex;flex-direction:column;background:
  linear-gradient(160deg,var(--paper) 0%,var(--paper) 55%,var(--paper2) 100%)}
.cover .masthead{padding:42px 200px 0 48px}
.cover .masthead .brand{font-family:var(--font-head);font-size:clamp(36px,4.6vw,64px);font-weight:700;letter-spacing:-.02em;line-height:1;margin:0}
.cover .masthead .sub{font-size:12px;letter-spacing:.3em;color:var(--muted);margin:10px 0 0;text-transform:uppercase}
.cover .issue-no{position:absolute;top:44px;right:48px;text-align:right;font-family:var(--font-head);line-height:1.2}
.cover .issue-no b{display:block;font-size:30px}
.cover .issue-no small{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.cover .headlines{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 48px 56px;gap:18px}
.cover .headlines .h{font-family:var(--font-head);font-size:clamp(19px,2.2vw,28px);line-height:1.45;font-weight:600;border-left:4px solid var(--ink);padding-left:16px}
.cover .headlines .h small{display:block;font-family:var(--font-body);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:4px}
.cover .foot{padding:0 48px 26px;font-size:11px;color:var(--muted);letter-spacing:.12em;display:flex;justify-content:space-between}

/* 目次 */
.toc-list{list-style:none;padding:0;margin:0}
.toc-list>li{break-inside:avoid;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.toc-list .sec{display:flex;align-items:baseline;gap:10px;font-family:var(--font-head);font-size:1.1em;font-weight:600;cursor:pointer}
.toc-list .sec .no{font-size:.75em;color:var(--accent);letter-spacing:.1em;min-width:2.2em;font-family:var(--font-body)}
.toc-list .sec .pg{margin-left:auto;font-size:.75em;color:var(--muted);font-family:var(--font-body)}
.toc-list .arts{list-style:none;padding:0 0 0 2.8em;margin:4px 0 0;font-size:.86em;color:var(--ink2)}
.toc-list .arts li{display:flex;gap:8px;cursor:pointer;margin:2px 0}
.toc-list .arts li:hover{color:var(--accent)}
.toc-list .arts .pg{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

/* セクション扉 */
.page.opener .body{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:48px;
  background:linear-gradient(to bottom,transparent 50%,color-mix(in srgb,var(--accent) 7%,transparent))}
.opener .big{font-family:var(--font-head);font-size:clamp(70px,9vw,120px);line-height:.9;color:var(--accent);opacity:.18;font-weight:700;position:absolute;top:30px;right:40px}
.opener h2{font-size:2.4em}
.opener .lead{font-size:1em}
.opener .list{list-style:none;padding:0;margin:16px 0 0;font-size:.9em;color:var(--ink2)}
.opener .list li{display:flex;gap:10px;margin:4px 0;cursor:pointer}
.opener .list li:hover{color:var(--accent)}
.opener .list .pg{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

/* 定点観測ボード */
.dash{width:100%;border-collapse:collapse;font-size:.86em}
.dash th{font-size:.8em}
.dash td{padding:7px 8px}
.dash .layer{font-size:.75em;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.dash .pick{font-weight:700;font-size:1.05em}
.dash .ver{color:var(--muted);font-size:.85em;margin-left:.4em;font-family:var(--font-mono)}
.dash .alt{color:var(--muted);font-size:.9em}
.dash .why{color:var(--ink2);font-size:.9em;line-height:1.5}
.dash .trend{white-space:nowrap;font-weight:700;font-size:.9em}
.trend-new{color:#8a3b12}.trend-changed{color:#a52a5c}.trend-version{color:#2f7d4f}.trend-flat{color:var(--muted);font-weight:400}
.dash .from{display:block;font-size:.8em;color:var(--muted);font-weight:400;text-decoration:line-through}
.dash .src a{color:var(--muted);text-decoration:none;font-size:.8em;margin-right:4px}
.legend{font-size:.78em;color:var(--muted);margin:0 0 10px;display:flex;gap:14px;flex-wrap:wrap}

/* リリースカレンダー */
.rel td:first-child{font-weight:700;white-space:nowrap}
.rel .v{font-family:var(--font-mono);font-size:.9em;white-space:nowrap}
.rel .d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* 今月試す */
.try .time{display:inline-block;font-size:.78em;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 10px;margin-bottom:12px}
.try ol.steps{counter-reset:s;list-style:none;padding:0}
.try ol.steps li{counter-increment:s;position:relative;padding-left:2.4em;margin:.5em 0}
.try ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:.1em;font-family:var(--font-head);font-size:1em;color:var(--accent);font-weight:700}

/* 用語集 */
.gloss dl{margin:0}
.gloss dt{font-weight:700;margin-top:8px}
.gloss dd{margin:0 0 4px;color:var(--ink2);font-size:.92em}

/* 奥付 */
.colophon .meta{font-size:.9em;color:var(--ink2);line-height:1.9}
.colophon ol{font-size:.8em;color:var(--muted);line-height:1.6;padding-left:2.4em}
.colophon ol li{margin:2px 0;overflow-wrap:anywhere}
.colophon a{color:var(--ink2);text-decoration:none}
.colophon a:hover{color:var(--accent)}
.incomplete{background:#9b1c1c;color:#fff;padding:8px 12px;border-radius:6px;font-size:.9em;margin-bottom:14px}

/* ===== HUD ===== */
#hud{position:fixed;left:0;right:0;bottom:0;height:var(--hud-h);display:flex;align-items:center;gap:10px;padding:0 14px;
  font-size:12px;color:var(--muted);user-select:none;letter-spacing:.04em}
#hud .btn{background:none;border:1px solid var(--rule);color:var(--ink2);border-radius:6px;height:28px;min-width:28px;padding:0 10px;
  font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
#hud .btn:hover{border-color:var(--accent);color:var(--accent)}
#hud .pos{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:7.5em}
#hud .sec{font-weight:700;color:var(--accent)}
#hud .sp{flex:1}
#hud kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--rule);border-radius:3px;padding:0 4px}
/* シークバー（クリック・ドラッグで移動） */
#seek{position:absolute;left:0;right:0;top:-4px;height:14px;cursor:pointer;touch-action:none}
#seek .rail{position:absolute;left:0;right:0;top:5px;height:4px;background:var(--rule);transition:height .15s,top .15s}
#seek .fill{position:absolute;left:0;top:0;height:100%;background:var(--accent);width:0}
#seek:hover .rail,#seek.active .rail{height:8px;top:3px}
#seek .knob{position:absolute;top:7px;width:14px;height:14px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%) scale(0);transition:transform .15s;box-shadow:0 0 0 3px var(--bg)}
#seek:hover .knob,#seek.active .knob{transform:translate(-50%,-50%) scale(1)}
#seek .tip{position:absolute;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11px;padding:3px 8px;border-radius:4px;white-space:nowrap;display:none;pointer-events:none}
#seek.active .tip,#seek:hover .tip{display:block}
.zone{position:fixed;top:0;bottom:var(--hud-h);width:60px;cursor:pointer;z-index:5;opacity:0;transition:opacity .2s}
.zone:hover{opacity:1}
.zone::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-top:2px solid var(--muted);border-left:2px solid var(--muted);transform:translateY(-50%) rotate(-45deg)}
.zone.prev{left:0}.zone.prev::after{left:18px}
.zone.next{right:0}.zone.next::after{right:18px;transform:translateY(-50%) rotate(135deg)}

/* 目次オーバーレイ */
#toc{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);z-index:20;display:none;overflow:auto;padding:40px 24px}
#toc.open{display:block}
#toc .inner{max-width:880px;margin:0 auto;background:var(--paper);padding:32px 40px;border-radius:10px;box-shadow:var(--shadow)}
#toc .inner h2{font-family:var(--font-head);margin:0 0 18px;font-size:22px}
#toc .toc-list{columns:2;column-gap:40px}
#toc .close{float:right;background:none;border:1px solid var(--rule);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink2);font:inherit}
figure.fig img{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(10,8,5,.92);z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;cursor:zoom-out;touch-action:pinch-zoom}
#lb.open{display:flex}
#lb img{max-width:min(96vw,1600px);max-height:calc(100vh - 90px);object-fit:contain;background:#fff;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#lb .cap{color:#e8e2d6;font-size:13px;max-width:900px;text-align:center;line-height:1.6}
#lb .x{position:absolute;top:14px;right:18px;color:#e8e2d6;font-size:26px;line-height:1;background:none;border:0;cursor:pointer}
#help{position:fixed;inset:auto 14px var(--hud-h) auto;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 16px;font-size:12px;line-height:1.9;display:none;z-index:21;box-shadow:var(--shadow)}
#help.open{display:block}

/* ===== 狭い画面 ===== */
@media (max-width:760px){
  body{font-size:14.5px}
  .page .body{padding:24px 20px 26px}
  .page h2{font-size:1.5em}
  .opener h2{font-size:2em}
  .cover .masthead{padding:30px 26px 0}
  .cover .masthead .brand{font-size:46px}
  .cover .issue-no{position:static;text-align:left;margin:14px 26px 0}
  .cover .headlines{padding:0 26px 40px}
  .cover .foot{padding:0 26px 20px}
  #toc .toc-list{columns:1}
  #hud .hint{display:none}
  .zone{width:28px}
}

/* ===== 印刷（PDF 化） ===== */
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  html,body{background:#fff;color:#000;font-size:11pt;overflow:visible}
  #book{position:static;overflow:visible;inset:auto}
  #track{display:block;transform:none!important;transition:none}
  .spread{display:contents}
  .page{height:auto;overflow:visible;box-shadow:none;break-before:page;border-radius:0;display:block;font-size:11pt}
  .page.blank,#hud,.zone,#toc,#help,#lb,#loader,.page .thumb,.page .more{display:none!important}
  #track{visibility:visible}
  .page .body{overflow:visible;padding:0}
  .page .folio{position:static;display:block;text-align:right;margin-top:10mm}
  .page.cover .body{min-height:240mm;display:flex}
  .cover .masthead,.cover .headlines,.cover .foot{padding-left:0;padding-right:0}
  .cover .issue-no{right:0;top:0}
  .opener .big{position:static;opacity:.25;font-size:60pt}
  .page.opener .body{background:none;min-height:0}
  a{color:#000}
  pre{white-space:pre-wrap;word-break:break-all}
  figure.fig img{max-height:120mm}
}
</style>
</head>
<body>
<div id="loader"><div class="bars">{{LOADER}}</div><div class="caption" style="--n:{{LOADER_N}}"><div class="word">magazine</div><div class="issue">{{LOADER_ISSUE}}</div></div></div>
<div id="book"><div id="track">
{{PAGES}}
</div></div>

<div class="zone prev" title="前のページ (←)"></div>
<div class="zone next" title="次のページ (→)"></div>

<div id="hud">
  <div id="seek"><div class="rail"><div class="fill" id="fill"></div></div><div class="knob" id="knob"></div><div class="tip" id="tip"></div></div>
  <button class="btn" id="b-prev" title="前のページ (←)">←</button>
  <button class="btn" id="b-next" title="次のページ (→)">→</button>
  <span class="pos" id="pos"></span>
  <span class="sec" id="cursec"></span>
  <span class="sp"></span>
  <span class="hint"><kbd>→</kbd> 次 <kbd>←</kbd> 前 <kbd>t</kbd> 目次 <kbd>p</kbd> 印刷　フリック・横スクロール・上のバーでも移動</span>
  <a class="btn" id="b-home" href="../index.html" title="号の一覧へ">一覧</a>
  <button class="btn" id="b-toc" title="目次 (t)">目次</button>
  <button class="btn" id="b-help" title="操作 (?)">?</button>
</div>

<div id="toc"><div class="inner">
  <button class="close" id="b-toc-close">閉じる</button>
  <h2>目次</h2>
  {{TOC}}
</div></div>

<div id="lb"><button class="x" id="lb-x" title="閉じる (Esc)">×</button><img id="lb-img" alt=""><div class="cap" id="lb-cap"></div></div>

<div id="help">
  <b>操作</b><br>
  → / Space / PageDown：次の見開き<br>
  ← / Shift+Space / PageUp：前の見開き<br>
  Home / End：表紙 / 奥付<br>
  t：目次　p：印刷（PDF 保存）　?：このヘルプ<br>
  フリック・トラックパッドの横スクロール・画面の左右端クリック・下のバーのドラッグでも移動できます
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const book = $('book'), track = $('track');
  const pages = Array.from(track.querySelectorAll('.page'));
  pages.forEach(p => p.remove());
  let spreads = [];
  let cur = 0;
  let two = false;
  let W = book.clientWidth;
  const BASE_TITLE = document.title;

  const blank = () => { const d = document.createElement('div'); d.className = 'page blank'; d.innerHTML = '<div class="mark">magazine</div>'; return d; };
  const isTwo = () => window.innerWidth >= 980 && window.innerWidth > window.innerHeight * 1.15;

  // data-group が同じ 2 ページを 1 見開きに。side=solo は右ページに単独で置く。
  function layout() {
    const keep = spreads[cur] ? pages.indexOf(spreads[cur].querySelector('.page:not(.blank)')) : 0;
    two = isTwo();
    track.textContent = '';
    spreads = [];
    const mk = (list) => { const s = document.createElement('div'); s.className = 'spread ' + (two ? 'two' : 'one'); list.forEach(p => s.appendChild(p)); track.appendChild(s); spreads.push(s); return s; };
    if (two) {
      let i = 0;
      while (i < pages.length) {
        const p = pages[i], q = pages[i + 1];
        if (p.dataset.side === 'solo') { mk([blank(), p]); i++; }
        else if (q && q.dataset.side !== 'solo' && q.dataset.group === p.dataset.group) { mk([p, q]); i += 2; }
        else { mk([p, blank()]); i++; }
      }
    } else {
      pages.forEach(p => mk([p]));
    }
    W = book.clientWidth;
    fitAll();
    goToPage(Math.max(0, keep), 'instant');
  }

  const markOverflow = (page, on) => {
    page.classList.toggle('overflow', on);
    if (on && !page.querySelector('.more')) { const d = document.createElement('div'); d.className = 'more'; d.textContent = '↓ 続きはスクロール'; page.appendChild(d); }
  };
  // はみ出すページは文字と図を段階的に縮める。それでも入らなければスクロール可にする。
  function fit(page) {
    if (page.classList.contains('blank') || page.classList.contains('scrollable')) return;
    const body = page.querySelector('.body');
    if (!body) return;
    page.classList.remove('overflow');
    page.style.removeProperty('--fs');
    page.style.removeProperty('--figh');
    const base = two ? 15 : 14.5;
    let fs = base, figh = 38;
    const over = () => body.scrollHeight > body.clientHeight + 1;
    while (over() && fs > base - 3) {
      fs -= 0.5; figh -= 2.5;
      page.style.setProperty('--fs', fs + 'px');
      page.style.setProperty('--figh', String(figh));
    }
    markOverflow(page, over());
  }
  // 記事見開き: 左ページ（見出し・まとめ・図）の空きに、右ページ本文の先頭ブロックを順に流し込む（読み順は左→右のまま）
  function balance(head, body) {
    const hb = head.querySelector('.body'), bb = body.querySelector('.body');
    let flow = hb.querySelector('.flow');
    if (!flow) { flow = document.createElement('div'); flow.className = 'flow'; hb.appendChild(flow); }
    if (bb.dataset.orig === undefined) bb.dataset.orig = bb.innerHTML;
    // いったん右ページを元に戻す
    bb.innerHTML = bb.dataset.orig; flow.innerHTML = '';
    const over = () => bb.scrollHeight > bb.clientHeight + 1;
    const headFits = () => hb.scrollHeight <= hb.clientHeight + 1;
    while (over()) {
      const el = bb.firstElementChild;
      if (!el || el.classList.contains('sources') || el.classList.contains('next-step')) break;
      if (el.tagName === 'UL' || el.tagName === 'OL') {
        // 箇条書きは項目単位で分割して流し込む
        const clone = el.cloneNode(false); flow.appendChild(clone);
        while (el.firstElementChild) {
          clone.appendChild(el.firstElementChild);
          if (!headFits()) { el.insertBefore(clone.lastElementChild, el.firstElementChild); break; }
        }
        if (!clone.children.length) { clone.remove(); break; }
        if (el.children.length) { if (el.tagName === 'OL') el.start = clone.children.length + 1; break; }
        el.remove();
        continue;
      }
      if (el.tagName === 'P') {
        flow.appendChild(el);
        if (headFits()) continue;
        bb.insertBefore(el, bb.firstChild);
        // 丸ごとは入らないので、文の切れ目（。！？）で分けて入るところまで左へ
        const tokens = [];
        for (const node of Array.from(el.childNodes)) {
          if (node.nodeType === 3) {
            const parts = node.textContent.split(/(?<=[。！？])/);
            for (const s of parts) if (s) tokens.push(document.createTextNode(s));
          } else tokens.push(node);
        }
        if (tokens.length < 2) break;
        const clone = el.cloneNode(false); clone.classList.add('cont');
        flow.appendChild(clone);
        el.textContent = '';
        let i = 0;
        for (; i < tokens.length; i++) {
          clone.appendChild(tokens[i]);
          if (!headFits()) { clone.removeChild(tokens[i]); break; }
        }
        // 残りを右ページの段落に戻す（最後に句点で終わるトークンまでで切る）
        while (i > 0 && !/[。！？]$/.test(clone.lastChild?.textContent || '') && clone.lastChild) { tokens.splice(i - 1, 0, clone.removeChild(clone.lastChild)); i--; if (clone.lastChild && clone.lastChild.nodeType === 3) break; }
        for (let j = i; j < tokens.length; j++) el.appendChild(tokens[j]);
        if (!clone.childNodes.length) clone.remove();
        if (!el.childNodes.length) el.remove();
        break;
      }
      flow.appendChild(el);
      if (!headFits()) { bb.insertBefore(el, bb.firstChild); break; }
    }
    // 見出しだけが左に残る「孤立見出し」を避ける
    const last = flow.lastElementChild;
    if (last && /^H[1-6]$/.test(last.tagName)) bb.insertBefore(last, bb.firstChild);
  }
  function fitPair(head, body) {
    const base = two ? 15 : 14.5;
    const bb = body.querySelector('.body');
    const over = () => bb.scrollHeight > bb.clientHeight + 1;
    for (const pg of [head, body]) { pg.classList.remove('overflow'); pg.style.removeProperty('--fs'); pg.style.removeProperty('--figh'); }
    let fs = base, figh = 38;
    balance(head, body);
    while (over() && fs > base - 3) {
      fs -= 0.5; figh -= 2.5;
      for (const pg of [head, body]) { pg.style.setProperty('--fs', fs + 'px'); pg.style.setProperty('--figh', String(figh)); }
      balance(head, body);
    }
    markOverflow(body, over());
    markOverflow(head, head.querySelector('.body').scrollHeight > head.querySelector('.body').clientHeight + 1);
  }
  function fitAll() {
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      if (p.classList.contains('art-head') && pages[i + 1] && pages[i + 1].classList.contains('art-body')) { fitPair(p, pages[i + 1]); i++; }
      else fit(p);
    }
  }

  const spreadOfPage = (pi) => spreads.findIndex(s => s.contains(pages[pi]));
  function setX(x, instant) { if (instant) track.classList.add('drag'); track.style.transform = `translate3d(${-x}px,0,0)`; if (instant) { void track.offsetWidth; track.classList.remove('drag'); } }
  function goTo(si, behavior = 'smooth') {
    si = Math.max(0, Math.min(spreads.length - 1, si));
    cur = si;
    setX(cur * W, behavior === 'instant');
    update();
  }
  const goToPage = (pi, behavior) => goTo(spreadOfPage(pi), behavior);
  const next = () => goTo(cur + 1);
  const prev = () => goTo(cur - 1);

  function spreadLabel(si) {
    const ps = Array.from(spreads[si].querySelectorAll('.page:not(.blank)'));
    const nums = ps.map(p => pages.indexOf(p) + 1);
    const pos = nums.length > 1 ? `p.${nums[0]}–${nums[nums.length - 1]}` : `p.${nums[0]}`;
    return { pos, sec: ps[0].dataset.secTitle || '', first: ps[0] };
  }
  function update() {
    const { pos, sec, first } = spreadLabel(cur);
    $('pos').textContent = `${pos} / ${pages.length}`;
    $('cursec').textContent = sec;
    const pct = spreads.length > 1 ? cur / (spreads.length - 1) * 100 : 0;
    $('fill').style.width = pct + '%';
    $('knob').style.left = pct + '%';
    const anchor = first.dataset.anchor || first.id;
    if (anchor && location.hash !== '#' + anchor) history.replaceState(null, '', '#' + anchor);
    document.title = sec ? `${sec} — ${BASE_TITLE}` : BASE_TITLE;
  }

  // ハッシュ → ページ
  const initialHash = location.hash;
  function pageFromHash(hash = location.hash) {
    const h = decodeURIComponent(hash.slice(1));
    if (!h) return -1;
    let p = pages.findIndex(x => x.id === h || x.dataset.anchor === h);
    if (p < 0) { const el = document.getElementById(h); if (el) p = pages.findIndex(x => x.contains(el)); }
    return p;
  }

  // キーボード
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tocOpen = $('toc').classList.contains('open');
    if (e.key === 'Escape') { $('toc').classList.remove('open'); $('help').classList.remove('open'); closeLb(); return; }
    if (lb.classList.contains('open')) return;
    if (e.key === 't' || e.key === 'T') { $('toc').classList.toggle('open'); e.preventDefault(); return; }
    if (e.key === '?') { $('help').classList.toggle('open'); return; }
    if (e.key === 'p' || e.key === 'P') { window.print(); return; }
    if (tocOpen) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) { next(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) { prev(); e.preventDefault(); }
    else if (e.key === 'Home') { goTo(0); e.preventDefault(); }
    else if (e.key === 'End') { goTo(spreads.length - 1); e.preventDefault(); }
  });
  document.querySelector('.zone.next').addEventListener('click', next);
  document.querySelector('.zone.prev').addEventListener('click', prev);
  $('b-next').addEventListener('click', next);
  $('b-prev').addEventListener('click', prev);
  $('b-toc').addEventListener('click', () => $('toc').classList.toggle('open'));
  $('b-toc-close').addEventListener('click', () => $('toc').classList.remove('open'));
  $('b-help').addEventListener('click', () => $('help').classList.toggle('open'));
  $('toc').addEventListener('click', e => { if (e.target === $('toc')) $('toc').classList.remove('open'); });

  // フリック（ドラッグ追従）。縦スクロールはページ内に任せる。
  let drag = null;
  book.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('a, button, #lb')) return;
    drag = { x: e.clientX, y: e.clientY, t: performance.now(), on: false, id: e.pointerId };
  });
  book.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on) {
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      drag.on = true; track.classList.add('drag'); book.setPointerCapture(drag.id);
    }
    e.preventDefault();
    const edge = (cur === 0 && dx > 0) || (cur === spreads.length - 1 && dx < 0) ? 0.35 : 1;
    track.style.transform = `translate3d(${-(cur * W) + dx * edge}px,0,0)`;
  });
  const endDrag = e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.on) return;
    track.classList.remove('drag');
    const dx = e.clientX - d.x, dt = Math.max(1, performance.now() - d.t);
    const v = dx / dt; // px/ms
    if (dx < -W * 0.18 || v < -0.6) next();
    else if (dx > W * 0.18 || v > 0.6) prev();
    else goTo(cur);
  };
  book.addEventListener('pointerup', endDrag);
  book.addEventListener('pointercancel', endDrag);
  book.addEventListener('dragstart', e => { if (drag && drag.on) e.preventDefault(); });

  // トラックパッドの横スクロール
  let wheelLock = 0, wheelAcc = 0;
  book.addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    const now = performance.now();
    if (now < wheelLock) return;
    wheelAcc += e.deltaX;
    if (Math.abs(wheelAcc) > 60) { wheelAcc > 0 ? next() : prev(); wheelAcc = 0; wheelLock = now + 650; }
  }, { passive: false });

  // シークバー: クリック・ホールドで移動
  const seek = $('seek');
  const seekIndex = (clientX) => { const r = seek.getBoundingClientRect(); const t = Math.min(1, Math.max(0, (clientX - r.left) / r.width)); return Math.round(t * (spreads.length - 1)); };
  const showTip = (clientX, si) => { const r = seek.getBoundingClientRect(); const { pos, sec } = spreadLabel(si); $('tip').style.left = Math.min(r.width - 60, Math.max(60, clientX - r.left)) + 'px'; $('tip').textContent = sec ? `${pos} · ${sec}` : pos; };
  let seeking = false;
  seek.addEventListener('pointerdown', e => { seeking = true; seek.classList.add('active'); seek.setPointerCapture(e.pointerId); const si = seekIndex(e.clientX); showTip(e.clientX, si); goTo(si, 'instant'); });
  seek.addEventListener('pointermove', e => { const si = seekIndex(e.clientX); showTip(e.clientX, si); if (seeking && si !== cur) goTo(si, 'instant'); });
  const endSeek = () => { seeking = false; seek.classList.remove('active'); };
  seek.addEventListener('pointerup', endSeek);
  seek.addEventListener('pointercancel', endSeek);

  // 画像の拡大表示
  const lb = $('lb');
  const openLb = (img) => { $('lb-img').src = img.src; $('lb-img').alt = img.alt; $('lb-cap').textContent = img.closest('figure')?.querySelector('figcaption')?.textContent || ''; lb.classList.add('open'); };
  const closeLb = () => { lb.classList.remove('open'); $('lb-img').removeAttribute('src'); };
  document.addEventListener('click', e => { const img = e.target.closest('figure.fig img'); if (img) { e.preventDefault(); openLb(img); } }, true);
  lb.addEventListener('click', closeLb);
  $('lb-x').addEventListener('click', closeLb);
  lb.addEventListener('wheel', e => e.stopPropagation(), { passive: true });

  // 目次・扉のリンク（data-goto="ページid"）
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-goto]');
    if (!t) return;
    const pi = pages.findIndex(p => p.id === t.dataset.goto);
    if (pi >= 0) { $('toc').classList.remove('open'); goToPage(pi); }
  });
  document.querySelectorAll('.page a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });

  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (isTwo() !== two) layout(); else { W = book.clientWidth; fitAll(); goTo(cur, 'instant'); } }, 120); });
  window.addEventListener('hashchange', () => { const p = pageFromHash(); if (p >= 0) goToPage(p); });

  const t0 = performance.now();
  layout();
  const start = pageFromHash(initialHash);
  if (start > 0) goToPage(start, 'instant');
  const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  const loaded = new Promise(res => { if (document.readyState === 'complete') res(); else window.addEventListener('load', res, { once: true }); });
  Promise.all([fontsReady, loaded]).then(() => {
    fitAll(); goTo(cur, 'instant');
    track.classList.add('ready');
    const loader = $('loader');
    const bars = loader.querySelectorAll('.bars i').length;
    const minShow = bars * 70 + 1230 + 600; // 色線 → 誌名 → 号数が出そろい（bars*70+1230ms）、少し見せてから退場
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => {
      loader.classList.add('done');
      setTimeout(() => { loader.classList.add('out'); setTimeout(() => loader.remove(), 500); }, reduce ? 0 : bars * 60 + 420);
    }, reduce ? 0 : Math.max(0, minShow - (performance.now() - t0)));
  });
})();
</script>
</body>
</html>
